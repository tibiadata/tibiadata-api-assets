name: Dispatch assets SHA

on:
  deployment_status:

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.deployment.environment == 'github-pages' &&
      github.event.deployment.ref == 'refs/heads/main' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TIBIADATA_CI_CLIENT_ID }}
          private-key: ${{ secrets.TIBIADATA_CI_PRIVATE_KEY }}
          owner: tibiadata
          repositories: tibiadata-argocd-app-of-apps
          permission-contents: write

      - name: Dispatch assets SHA
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: tibiadata/tibiadata-argocd-app-of-apps
          event-type: bump-tibiadata-api-assets-sha
          client-payload: '{"assets_sha":"${{ github.event.deployment.sha }}"}'
