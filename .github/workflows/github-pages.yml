name: GitHub Pages deployment

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
  repository_dispatch:
    types:
      - tibiadata-api-assets-deploy
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  argocd:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    needs: deploy
    steps:
      - name: Create tibiadata-argocd-app-of-apps dispatch token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TIBIADATA_CI_CLIENT_ID }}
          private-key: ${{ secrets.TIBIADATA_CI_PRIVATE_KEY }}
          owner: tibiadata
          repositories: tibiadata-argocd-app-of-apps
          permission-contents: write

      - name: Trigger workflow in tibiadata-argocd-app-of-apps repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          repository: tibiadata/tibiadata-argocd-app-of-apps
          event-type: bump-tibiadata-api-assets-sha
          client-payload: '{"assets_sha":"${{ github.sha }}"}'
