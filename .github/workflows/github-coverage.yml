name: code-coverage

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "go.mod"
      - "go.sum"
      - "tools/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "go.mod"
      - "go.sum"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        shell: bash
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Uploading coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tibiadata/tibiadata-api-assets
          files: coverage.out

      - name: Convert coverage report to Cobertura format
        shell: bash
        run: |
          go tool -modfile=tools/go.mod gocover-cobertura < coverage.out > coverage.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report-go
          path: coverage.xml

  upload-coverage-go:
    needs: coverage-go
    if: ${{ !cancelled() && needs.coverage-go.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-report-go

      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage-agent
