name: code-coverage

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        shell: bash
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Convert coverage report to Cobertura format
        shell: bash
        run: |
          go run github.com/boumenot/gocover-cobertura@latest < coverage.out > coverage.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-go
          path: coverage.xml

  upload-coverage-go:
    needs: coverage-go
    if: ${{ !cancelled() && needs.coverage-go.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-go

      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage-agent
